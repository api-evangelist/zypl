name: Zypl
description: >-
  Zypl (zypl.ai) is an AI company building synthetic-data and machine-learning technology for
  financial services and government. Its core is proprietary zGAN generative synthetic-data
  technology, delivered through Lucid, a no-code platform for developing and deploying robust
  scoring models. Products include zScore for credit decisioning, plus fraud detection, collection
  scoring, and IFRS-9/GAAP-compliant provisioning for credit-loss estimation. Zypl serves banks,
  financial institutions, and public-sector entities, and operates an R&D lab (zehnlab.ai). It is
  backed by Prosus Ventures. Zypl publishes no public developer/API surface at this time; this
  profile carries verified identity and a live domain-security probe.
